[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "mindwar-arena"
version = "1.0.0"
description = "A high-performance offline strategy game engine and AI arena featuring 9 deterministic board games."
readme = "README.md"
authors = [{ name = "MindWar Arena Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.0",
    "moderngl>=5.12.0",
    "numpy>=1.26.0",
    "pyglm>=2.7.0",
    "Pillow>=10.0.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
[project.scripts]
mindwar = "main:main"
[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q"
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true